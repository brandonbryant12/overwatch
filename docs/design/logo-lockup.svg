<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 64" width="384" height="64" role="img" aria-label="Overwatch">
  <defs>
    <linearGradient id="owl-housing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#172230"/>
      <stop offset="100%" stop-color="#090d12"/>
    </linearGradient>
    <linearGradient id="owl-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38d9c0"/>
      <stop offset="50%" stop-color="#edf2f7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="owl-core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe08a"/>
      <stop offset="50%" stop-color="#f5a623"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- Mark -->
  <g>
    <path d="M19 3 H45 L61 19 V45 L45 61 H19 L3 45 V19 Z" fill="url(#owl-housing)" stroke="#2b3d52" stroke-width="2"/>
    <path d="M16 18 A22 22 0 0 1 48 18" fill="none" stroke="#38d9c0" stroke-width="1.5" stroke-linecap="round" opacity="0.55"/>
    <path d="M48 46 A22 22 0 0 1 16 46" fill="none" stroke="#38d9c0" stroke-width="1.5" stroke-linecap="round" opacity="0.55"/>
    <path d="M32 7.5 V12.5 M32 51.5 V56.5 M7.5 32 H12.5 M51.5 32 H56.5" stroke="#38d9c0" stroke-width="1.8" stroke-linecap="square" opacity="0.85"/>
    <path d="M11 32 C19.5 18 44.5 18 53 32 C44.5 46 19.5 46 11 32 Z" fill="#0b0f14" stroke="url(#owl-ring)" stroke-width="2.8" stroke-linejoin="round"/>
    <path d="M32 21.5 L42.5 32 L32 42.5 L21.5 32 Z" fill="url(#owl-core)"/>
    <path d="M32 21.5 V25.5 M32 38.5 V42.5 M21.5 32 H25.5 M38.5 32 H42.5" stroke="#0b0f14" stroke-width="1.3"/>
    <circle cx="32" cy="32" r="3.2" fill="#0b0f14"/>
    <circle cx="32" cy="32" r="1.1" fill="#ffe08a"/>
  </g>
  <!-- Hand-authored geometric wordmark: OVERWATCH (pure paths, zero font dependencies) -->
  <g transform="translate(80 18)" fill="none" stroke="#edf2f7" stroke-width="3.2" stroke-linecap="square" stroke-linejoin="miter">
    <!-- O (chamfered octagon echoing the mark) -->
    <path d="M6 0 H18 L24 6 V22 L18 28 H6 L0 22 V6 Z"/>
    <!-- V -->
    <path d="M33 0 L44 28 L55 0" stroke-linejoin="bevel"/>
    <!-- E -->
    <path d="M84 0 H64 V28 H84 M64 14 H80"/>
    <!-- R -->
    <path d="M94 28 V0 H110 L116 6 V11 L110 16 H94 M107 16 L117 28"/>
    <!-- W -->
    <path d="M126 0 L132 28 L140 10 L148 28 L154 0" stroke-linejoin="bevel"/>
    <!-- A -->
    <path d="M163 28 L174 0 L185 28 M167 19 H181" stroke-linejoin="bevel"/>
    <!-- T -->
    <path d="M192 0 H216 M204 0 V28"/>
    <!-- C (chamfered) -->
    <path d="M246 6 L240 0 H228 L222 6 V22 L228 28 H240 L246 22"/>
    <!-- H -->
    <path d="M256 0 V28 M278 0 V28 M256 14 H278"/>
  </g>
  <!-- Amber focus dot accent after wordmark -->
  <path d="M370 40 L375 45 L370 50 L365 45 Z" fill="#f5a623"/>
</svg>
