<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Overwatch mark">
  <defs>
    <linearGradient id="owm-housing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#172230"/>
      <stop offset="100%" stop-color="#090d12"/>
    </linearGradient>
    <linearGradient id="owm-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38d9c0"/>
      <stop offset="50%" stop-color="#edf2f7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="owm-core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe08a"/>
      <stop offset="50%" stop-color="#f5a623"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- Chamfered octagonal instrument housing -->
  <path d="M38 6 H90 L122 38 V90 L90 122 H38 L6 90 V38 Z" fill="url(#owm-housing)" stroke="#2b3d52" stroke-width="3"/>
  <!-- Inner hairline chamfer -->
  <path d="M41 13 H87 L115 41 V87 L87 115 H41 L13 87 V41 Z" fill="none" stroke="#38d9c0" stroke-width="1" opacity="0.22"/>
  <!-- Broken orbital scan arcs -->
  <path d="M32 36 A44 44 0 0 1 96 36" fill="none" stroke="#38d9c0" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>
  <path d="M96 92 A44 44 0 0 1 32 92" fill="none" stroke="#38d9c0" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>
  <!-- Cardinal sight ticks -->
  <path d="M64 15 V25 M64 103 V113 M15 64 H25 M103 64 H113" stroke="#38d9c0" stroke-width="3" stroke-linecap="square" opacity="0.85"/>
  <!-- Optical aperture eye -->
  <path d="M22 64 C39 36 89 36 106 64 C89 92 39 92 22 64 Z" fill="#0b0f14" stroke="url(#owm-ring)" stroke-width="5" stroke-linejoin="round"/>
  <!-- Subtle iris calibration ring -->
  <circle cx="64" cy="64" r="24" fill="none" stroke="#38d9c0" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5"/>
  <!-- Focus reticle diamond -->
  <path d="M64 43 L85 64 L64 85 L43 64 Z" fill="url(#owm-core)"/>
  <!-- Precision crosshair cuts in the diamond -->
  <path d="M64 43 V51 M64 77 V85 M43 64 H51 M77 64 H85" stroke="#0b0f14" stroke-width="2.2"/>
  <!-- Optical pinhole -->
  <circle cx="64" cy="64" r="6.5" fill="#0b0f14"/>
  <circle cx="64" cy="64" r="2.2" fill="#ffe08a"/>
</svg>
