<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Overwatch</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar" id="topbar">
      <div class="topbar-inner">
        <a href="#now" class="brand" id="brand-link" aria-label="Overwatch home">
          <svg class="brand-mark" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
            <rect x="1.5" y="1.5" width="15" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="1.75" />
            <path d="M5 9.5L7.8 12L13 6" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span class="brand-name">Overwatch</span>
        </a>

        <nav class="nav-tabs" role="tablist" aria-label="Primary views" id="nav-tabs">
          <button class="nav-tab" role="tab" data-view="now" aria-selected="true">Now</button>
          <button class="nav-tab" role="tab" data-view="environments" aria-selected="false">Environments</button>
          <button class="nav-tab" role="tab" data-view="incidents" aria-selected="false">
            Incidents <span class="tab-count" id="nav-incident-count"></span>
          </button>
          <button class="nav-tab" role="tab" data-view="insights" aria-selected="false">
            Insights <span class="tab-count" id="nav-insight-count"></span>
          </button>
          <button class="nav-tab" role="tab" data-view="runs" aria-selected="false">Runs</button>
          <button class="nav-tab" role="tab" data-view="scorecard" aria-selected="false">Scorecard</button>
        </nav>

        <div class="topbar-actions">
          <span class="spend-readout" id="spend-readout">$0.00 / $15 daily</span>
          <button class="control-subtle" id="btn-palette" type="button" title="Command palette (Cmd+K)">
            Command
            <kbd class="kbd-hint">⌘K</kbd>
          </button>
          <button class="control-subtle" id="btn-theme" type="button" aria-label="Toggle color theme">
            Dark
          </button>
          <button class="btn-primary" id="btn-collect-all" type="button">Collect now</button>
        </div>
      </div>
    </header>

    <main class="workspace" id="workspace" aria-live="polite"></main>

    <footer class="statusbar" id="statusbar">
      <div class="statusbar-inner">
        <span id="status-message">Connecting to Overwatch daemon...</span>
        <span class="status-meta" id="status-meta">Cursor 0</span>
      </div>
    </footer>

    <!-- Evidence & Trace-Diff Drawer -->
    <aside class="drawer-backdrop hidden" id="evidence-backdrop" aria-hidden="true">
      <div class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
        <div class="drawer-header">
          <h2 id="drawer-title">Evidence detail</h2>
          <button class="control-subtle" id="drawer-close" type="button">Close</button>
        </div>
        <div class="drawer-body" id="drawer-body"></div>
      </div>
    </aside>

    <!-- Cmd+K Command Palette -->
    <div class="palette-backdrop hidden" id="palette-backdrop" aria-hidden="true">
      <div class="palette" role="dialog" aria-modal="true" aria-label="Command palette">
        <input
          type="text"
          id="palette-input"
          class="palette-input"
          placeholder="Jump to view, environment, incident, or trigger action..."
          autocomplete="off"
        />
        <div class="palette-list" id="palette-list" role="listbox"></div>
      </div>
    </div>

    <div class="toast-region" id="toast-region" aria-live="assertive"></div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
