<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Overwatch</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="page.css">
  <script>
    try { const t = localStorage.getItem("ow-theme"); if (t) document.documentElement.dataset.theme = t; else if (matchMedia("(prefers-color-scheme: light)").matches) document.documentElement.dataset.theme = "light" } catch {}
  </script>
</head>
<body>
  <div id="app" style="display: contents"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
