<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Overwatch</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="page.css">
  <script>
    try { const t = localStorage.getItem("ow-theme"); if (t) document.documentElement.dataset.theme = t; else if (matchMedia("(prefers-color-scheme: light)").matches) document.documentElement.dataset.theme = "light" } catch {}
  </script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="Overwatch">
      <img src="logo.svg" alt="" width="28" height="28">
      <span class="wordmark">Overwatch<i>.</i></span>
    </a>
    <span class="connection" data-connection="unknown" aria-live="polite"><span class="pulse" aria-hidden="true"></span><span class="connection-text">Connecting…</span></span>
    <span class="spacer"></span>
    <div class="tools">
      <button type="button" class="icon-button" data-theme-toggle title="Theme (t)" aria-label="Toggle theme"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="4"/><path d="M10 1.5v2M10 16.5v2M1.5 10h2M16.5 10h2M4 4l1.4 1.4M14.6 14.6L16 16M4 16l1.4-1.4M14.6 5.4L16 4"/></svg></button>
      <button type="button" class="icon-button" data-help title="Keyboard (?)" aria-label="Keyboard shortcuts"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="5" width="16" height="10" rx="2"/><path d="M5 8h1M8 8h1M11 8h1M14 8h1M6 12h8"/></svg></button>
    </div>
  </header>
  <div class="banners" data-banners></div>
  <nav class="strip" data-strip aria-label="Environments"></nav>
  <main class="deck">
    <section class="rail" aria-label="Inbox">
      <div class="rail-head">
        <h1>Inbox</h1>
        <button type="button" class="pending" data-pending data-pending-count="0" hidden></button>
      </div>
      <div class="groups" data-groups></div>
    </section>
    <section class="stage" data-stage aria-live="polite"></section>
    <form class="dock" data-dock autocomplete="off">
      <div class="dock-meta">
        <span class="chip" data-chip>Nothing in focus: Enter finds</span>
        <span class="route" data-route></span>
      </div>
      <div class="dock-row">
        <textarea data-prompt rows="1" placeholder="Find anything, or ask about what is in focus" aria-label="Find or ask"></textarea>
        <button type="submit" class="send" data-send>Ask <kbd>↵</kbd></button>
      </div>
    </form>
  </main>
  <div class="toast" data-toast role="status" aria-live="polite"></div>
  <div data-overlay></div>
  <script type="module" src="app.mjs"></script>
</body>
</html>
